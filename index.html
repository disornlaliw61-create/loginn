<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCore - High Tech Authentication</title>
    <style>
        :root {
            --primary-color: #00f3ff;
            --secondary-color: #ff0055;
            --bg-dark: #080b10;
            --panel-bg: rgba(10, 20, 35, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Sci-Fi Background Grid & Glow */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotateX(60deg) translateY(-20%);
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: rotateX(60deg) translateY(0); }
            100% { transform: rotateX(60deg) translateY(40px); }
        }

        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
        }

        /* Container & Cards */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--primary-color);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(0, 243, 255, 0.1);
            border-radius: 12px;
            padding: 40px;
            backdrop-filter: blur(10px);
            transition: all 0.5s ease;
        }

        .hidden {
            display: none !important;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary-color);
        }

        /* Form Controls */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #8a99ad;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #0088ff, var(--primary-color));
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .btn:hover {
            box-shadow: 0 0 25px var(--primary-color);
            transform: translateY(-2px);
        }

        .error-msg {
            color: var(--secondary-color);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        /* 3D Interactive Object Page */
        .dashboard {
            max-width: 600px;
            text-align: center;
        }

        .scene {
            width: 180px;
            height: 180px;
            margin: 20px auto 40px;
            perspective: 600px;
        }

        .cpu-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s ease;
            cursor: pointer;
        }

        .cpu-card.rotated {
            transform: rotateY(360deg);
        }

        .cpu-face {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #112233, #050a10);
            border: 2px solid var(--primary-color);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .cpu-icon {
            font-size: 50px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 8px var(--primary-color));
        }

        .cpu-label {
            font-size: 0.8rem;
            color: var(--primary-color);
            letter-spacing: 1px;
        }

        .hint-text {
            font-size: 0.8rem;
            color: #6a798d;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="container">
        <!-- หน้าที่ 1: หน้าเข้าสู่ระบบ (Login) -->
        <div id="login-page" class="card">
            <h2>CYBER ACCESS</h2>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="username">USERNAME</label>
                    <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้งาน (admin)" required>
                </div>
                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" placeholder="กรอกรหัสผ่าน (1234)" required>
                </div>
                <button type="submit" class="btn">LOG IN</button>
            </form>
            <div id="error-message" class="error-msg"></div>
        </div>

        <!-- หน้าที่ 2: หน้าหลักหลังล็อกอิน (Dashboard) -->
        <div id="dashboard-page" class="card dashboard hidden">
            <h2>CYBER CORE SYSTEM</h2>
            <p class="hint-text">คลิกที่ CPU ด้านล่างเพื่อทำการหมุน 360 องศา</p>

            <!-- 3D CPU Object ที่หมุนได้ -->
            <div class="scene">
                <div id="cpu-object" class="cpu-card" onclick="rotateCPU()">
                    <div class="cpu-face">
                        <div class="cpu-icon">🔲</div>
                        <div class="cpu-label">CPU CORE v.2026</div>
                        <div style="font-size:0.7rem; color:#8a99ad; margin-top:5px;">[ กดเพื่อหมุน ]</div>
                    </div>
                </div>
            </div>

            <!-- ช่องใส่ URL เพื่อเปลี่ยนไปยังเว็บอื่น -->
            <div class="input-group">
                <label for="target-url">URL REDIRECT</label>
                <input type="text" id="target-url" placeholder="https://example.com" value="https://google.com">
            </div>
            <button class="btn" onclick="navigateToUrl()">ไปยังเว็บไซต์</button>
        </div>
    </div>

    <script>
        // รหัสผ่านและชื่อผู้ใช้สำหรับเข้าสู่ระบบ (สามารถเปลี่ยนได้ที่นี่)
        const VALID_USER = "admin";
        const VALID_PASS = "1234";

        // ฟังก์ชั่นจัดการการล็อกอิน
        function handleLogin(event) {
            // ป้องกันไม่ให้หน้าเว็บ Refresh เมื่อกด Submit หรือกด Enter
            event.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');

            // ตรวจสอบความถูกต้องของรหัสผ่าน
            if (user === VALID_USER && pass === VALID_PASS) {
                errorMsg.innerText = "";
                // สลับไปยังหน้าที่ 2
                document.getElementById('login-page').classList.add('hidden');
                document.getElementById('dashboard-page').classList.remove('hidden');
            } else {
                errorMsg.innerText = "ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง!";
            }
        }

        // ฟังก์ชั่นสำหรับหมุน CPU ในหน้าที่ 2
        function rotateCPU() {
            const cpu = document.getElementById('cpu-object');
            cpu.classList.add('rotated');
            
            // ลบคลาสออกเมื่อหมุนครบรอบ เพื่อให้กดหมุนใหม่ได้เรื่อยๆ
            setTimeout(() => {
                cpu.classList.remove('rotated');
            }, 1000);
        }

        // ฟังก์ชั่นเปิดไปยัง URL ที่ผู้ใช้ระบุ
        function navigateToUrl() {
            let url = document.getElementById('target-url').value.trim();
            
            if (!url) {
                alert("กรุณากรอก URL เว็บไซต์");
                return;
            }

            // ถ้าผู้ใช้ไม่ได้ใส่ http:// หรือ https:// ให้เติมอัตโนมัติ
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            // เปิดไปยังเว็บไซต์เป้าหมาย
            window.location.href = url;
        }
    </script>
</body>
</html>
