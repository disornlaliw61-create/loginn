<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NONG CHABA KAEW LOGIN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background:#06111f;
    color:white;
}

/* ================================
   พื้นหลัง
================================ */

body{
    background:
        radial-gradient(circle at 50% 45%, rgba(0,160,255,.18), transparent 28%),
        radial-gradient(circle at 80% 30%, rgba(255,130,50,.10), transparent 25%),
        linear-gradient(135deg,#06101d,#102941 50%,#071321);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.25;

    background-image:
        linear-gradient(rgba(0,180,255,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,180,255,.08) 1px,transparent 1px);

    background-size:45px 45px;
}

/* แสงด้านหลัง */

.background-light{
    position:fixed;
    width:600px;
    height:600px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,
        rgba(0,170,255,.18),
        rgba(0,100,255,.06) 35%,
        transparent 70%);
    filter:blur(10px);
    pointer-events:none;
}

/* ================================
   หน้าหลัก
================================ */

.page{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:
        opacity .8s ease,
        transform .8s ease;
}

.page.hidden{
    opacity:0;
    pointer-events:none;
    transform:scale(1.08);
}

.page.active{
    opacity:1;
    pointer-events:auto;
    transform:scale(1);
}

/* ================================
   หัวข้อ
================================ */

.header{
    position:absolute;
    left:4%;
    top:6%;
    z-index:20;
}

.header h1{
    font-size:clamp(26px,3vw,46px);
    font-weight:800;
    text-shadow:
        0 0 10px rgba(255,255,255,.3),
        0 0 30px rgba(0,170,255,.3);
}

.header p{
    margin-top:8px;
    font-size:clamp(14px,1.5vw,22px);
    color:#b8c9dc;
}

/* ================================
   CPU FAN
================================ */

.cpu{
    position:relative;
    width:min(52vw,550px);
    height:min(52vw,550px);
    min-width:300px;
    min-height:300px;
    max-width:550px;
    max-height:550px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    filter:
        drop-shadow(0 0 18px rgba(0,160,255,.35))
        drop-shadow(0 0 20px rgba(255,130,40,.20));
}

/* กรอบพัดลม */

.fan-frame{
    position:absolute;
    inset:0;
    border-radius:15%;
    border:3px solid rgba(70,170,220,.55);

    background:
        linear-gradient(135deg,
            rgba(30,60,80,.85),
            rgba(5,15,25,.92));

    box-shadow:
        inset 0 0 30px rgba(0,150,255,.18),
        0 0 20px rgba(0,150,255,.15);
}

/* มุมสกรู */

.screw{
    position:absolute;
    width:27px;
    height:27px;
    border-radius:50%;
    border:3px solid #8aa7ba;

    background:#1b3345;

    box-shadow:
        inset 0 0 5px #000,
        0 0 5px rgba(0,180,255,.4);

    z-index:8;
}

.screw:nth-child(1){
    left:20px;
    top:20px;
}

.screw:nth-child(2){
    right:20px;
    top:20px;
}

.screw:nth-child(3){
    left:20px;
    bottom:20px;
}

.screw:nth-child(4){
    right:20px;
    bottom:20px;
}

/* วงแหวนไฟ */

.light-ring{
    position:absolute;
    width:88%;
    height:88%;
    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            #00c8ff,
            #1688ff,
            #00eaff,
            #153b91,
            #ff8c42,
            #ffc267,
            #ff8138,
            #00c8ff
        );

    animation:ringRotate 4s linear infinite;

    box-shadow:
        0 0 15px #00bfff,
        0 0 35px rgba(0,170,255,.65),
        0 0 45px rgba(255,130,40,.25);
}

.light-ring::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:50%;
    background:#071321;
}

/* ใบพัด */

.blades{
    position:absolute;
    width:76%;
    height:76%;
    border-radius:50%;

    animation:fanRotate 1.2s linear infinite;

    z-index:3;
}

.blade{
    position:absolute;
    width:27%;
    height:44%;

    left:36.5%;
    top:7%;

    border-radius:
        70% 20% 70% 20%;

    transform-origin:50% 100%;

    background:
        linear-gradient(
            135deg,
            #d9efff 0%,
            #4d7692 40%,
            #152f43 100%
        );

    box-shadow:
        inset -8px -5px 12px rgba(0,0,0,.45),
        0 0 8px rgba(80,190,255,.2);
}

/* ทำ 7 ใบพัด */

.blade:nth-child(1){transform:rotate(0deg);}
.blade:nth-child(2){transform:rotate(51.4deg);}
.blade:nth-child(3){transform:rotate(102.8deg);}
.blade:nth-child(4){transform:rotate(154.2deg);}
.blade:nth-child(5){transform:rotate(205.6deg);}
.blade:nth-child(6){transform:rotate(257deg);}
.blade:nth-child(7){transform:rotate(308.4deg);}

/* กลางพัดลม */

.fan-center{
    position:absolute;
    width:28%;
    height:28%;

    border-radius:50%;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    background:
        radial-gradient(
            circle at 35% 25%,
            #48cfff,
            #0867bd 35%,
            #031a34 80%
        );

    border:4px solid #49cfff;

    box-shadow:
        0 0 10px #00bfff,
        0 0 30px rgba(0,190,255,.8),
        inset 0 0 20px rgba(0,0,0,.6);

    user-select:none;
}

.fan-center:hover{
    transform:scale(1.06);
    box-shadow:
        0 0 15px #00d9ff,
        0 0 45px rgba(0,190,255,1),
        inset 0 0 20px rgba(0,0,0,.6);
}

.fan-center:active{
    transform:scale(.96);
}

.login-main{
    font-size:clamp(20px,3vw,42px);
    font-weight:900;
    letter-spacing:1px;
}

.login-sub{
    margin-top:5px;
    font-size:clamp(10px,1.2vw,17px);
    color:#d6efff;
}

/* ข้อความล่าง */

.click-text{
    position:absolute;
    bottom:5%;
    left:50%;
    transform:translateX(-50%);

    font-size:clamp(15px,1.5vw,22px);
    color:#e7f7ff;

    text-shadow:0 0 12px #00aaff;

    animation:textGlow 2s ease-in-out infinite;
}

/* ================================
   LOGIN PAGE
================================ */

.login-page{
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    position:relative;
    width:min(470px,90vw);
    padding:38px 35px 42px;

    border:1px solid rgba(80,210,255,.55);
    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            rgba(9,31,50,.90),
            rgba(3,12,24,.94)
        );

    backdrop-filter:blur(18px);

    box-shadow:
        0 0 25px rgba(0,180,255,.22),
        inset 0 0 25px rgba(0,160,255,.08);

    z-index:20;
}

.login-title{
    text-align:center;
    font-size:32px;
    font-weight:800;
    color:#dff7ff;

    text-shadow:
        0 0 12px #00bfff;
}

.login-title span{
    display:block;
    margin-top:5px;
    font-size:14px;
    font-weight:400;
    color:#91b6cc;
}

/* ช่องกรอก */

.input-group{
    position:relative;
    margin-top:24px;
}

.input-group input{
    width:100%;
    height:58px;

    padding:0 18px 0 52px;

    border-radius:13px;
    border:1px solid rgba(70,190,240,.6);

    outline:none;

    color:white;
    font-size:17px;

    background:
        rgba(15,50,75,.7);

    box-shadow:
        inset 0 0 15px rgba(0,150,255,.08),
        0 0 10px rgba(0,150,255,.06);

    transition:.25s;
}

.input-group input:focus{
    border-color:#00d9ff;

    box-shadow:
        0 0 12px rgba(0,210,255,.5),
        inset 0 0 15px rgba(0,150,255,.1);
}

.input-icon{
    position:absolute;
    left:17px;
    top:50%;
    transform:translateY(-50%);

    font-size:22px;
    color:#70dfff;
}

/* ปุ่ม Login */

.login-button{
    width:100%;
    height:58px;

    margin-top:25px;

    border:none;
    border-radius:14px;

    color:white;
    font-size:21px;
    font-weight:800;

    cursor:pointer;

    background:
        linear-gradient(
            90deg,
            #087eff,
            #00cfff,
            #ff9a42
        );

    background-size:200% 100%;

    box-shadow:
        0 0 15px rgba(0,180,255,.45);

    animation:buttonFlow 3s linear infinite;

    transition:.25s;
}

.login-button:hover{
    transform:translateY(-2px) scale(1.01);

    box-shadow:
        0 0 20px rgba(0,210,255,.75),
        0 0 35px rgba(255,140,50,.25);
}

.login-button:active{
    transform:scale(.97);
}

/* ตอนยังไม่กรอก */

.login-button.hidden-button{
    display:none;
}

/* ข้อความผิด */

.error{
    min-height:24px;
    margin-top:15px;

    text-align:center;

    color:#ff7373;

    font-size:14px;

    text-shadow:0 0 8px rgba(255,0,0,.6);
}

/* ================================
   ROBOT
================================ */

.robot{
    position:absolute;

    width:180px;
    height:250px;

    right:7%;
    bottom:9%;

    animation:
        robotFloat 3.5s ease-in-out infinite,
        robotTilt 5s ease-in-out infinite;

    z-index:5;
}

/* หัว */

.robot-head{
    position:absolute;

    width:125px;
    height:105px;

    left:28px;
    top:15px;

    border-radius:38px;

    background:
        linear-gradient(
            145deg,
            #f7fbff,
            #a9c2d0
        );

    border:3px solid #47768e;

    box-shadow:
        0 10px 20px rgba(0,0,0,.35);
}

/* จอหน้า */

.robot-face{
    position:absolute;

    width:91px;
    height:61px;

    left:14px;
    top:20px;

    border-radius:25px;

    background:
        radial-gradient(
            circle,
            #153b54,
            #031624
        );

    border:3px solid #42d8ff;

    box-shadow:
        inset 0 0 15px #00bfff,
        0 0 15px rgba(0,210,255,.55);
}

/* ตา */

.eye{
    position:absolute;

    width:13px;
    height:13px;

    border-radius:50%;

    background:#65eaff;

    top:21px;

    box-shadow:0 0 10px #00dfff;

    animation:blink 4s infinite;
}

.eye.left{
    left:22px;
}

.eye.right{
    right:22px;
}

/* ปาก */

.mouth{
    position:absolute;

    width:28px;
    height:13px;

    border-bottom:3px solid #5eeaff;

    border-radius:0 0 30px 30px;

    left:31px;
    bottom:10px;
}

/* เสาอากาศ */

.antenna{
    position:absolute;

    width:4px;
    height:25px;

    background:#68dfff;

    left:89px;
    top:-10px;
}

.antenna::before{
    content:"";

    position:absolute;

    width:12px;
    height:12px;

    border-radius:50%;

    left:-4px;
    top:-8px;

    background:#ff9c46;

    box-shadow:0 0 12px #ff8c38;
}

/* ลำตัว */

.robot-body{
    position:absolute;

    width:100px;
    height:105px;

    left:40px;
    top:110px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            #f6fbff,
            #9db8c8
        );

    border:3px solid #47768e;
}

/* หน้าอก */

.robot-screen{
    position:absolute;

    width:55px;
    height:35px;

    left:20px;
    top:25px;

    border-radius:7px;

    background:#12344a;

    border:2px solid #48ddff;

    box-shadow:0 0 8px #00cfff;
}

.robot-screen::after{
    content:"";

    position:absolute;

    left:10px;
    right:10px;
    bottom:7px;

    height:3px;

    background:#54eaff;

    box-shadow:
        0 -7px 0 #54eaff,
        12px -14px 0 #54eaff;
}

/* แขน */

.arm{
    position:absolute;

    width:27px;
    height:83px;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #cfe3ed,
            #7898aa
        );

    border:3px solid #47768e;

    top:120px;
}

.arm.left{
    left:18px;
    transform:rotate(22deg);
}

.arm.right{
    right:13px;

    transform-origin:top center;

    animation:wave 2.5s ease-in-out infinite;
}

/* มือ */

.hand{
    position:absolute;

    width:32px;
    height:32px;

    border-radius:50%;

    background:#d8e9f0;

    border:3px solid #47768e;

    bottom:-18px;
    left:-5px;
}

/* ================================
   ANIMATION
================================ */

@keyframes fanRotate{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

@keyframes ringRotate{
    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(-360deg);
    }
}

@keyframes robotFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }
}

@keyframes robotTilt{
    0%,100%{
        rotate:0deg;
    }

    50%{
        rotate:1.5deg;
    }
}

@keyframes wave{
    0%,100%{
        transform:rotate(-10deg);
    }

    50%{
        transform:rotate(15deg);
    }
}

@keyframes blink{
    0%,90%,100%{
        transform:scaleY(1);
    }

    94%{
        transform:scaleY(.1);
    }
}

@keyframes textGlow{
    0%,100%{
        opacity:.7;
    }

    50%{
        opacity:1;
        text-shadow:
            0 0 10px #00bfff,
            0 0 25px #00bfff;
    }
}

@keyframes buttonFlow{
    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

/* ================================
   มือถือ
================================ */

@media(max-width:700px){

    .header{
        left:5%;
        top:4%;
    }

    .header h1{
        font-size:25px;
    }

    .header p{
        font-size:13px;
    }

    .cpu{
        width:82vw;
        height:82vw;

        min-width:280px;
        min-height:280px;
    }

    .robot{
        opacity:.35;
        transform:scale(.65);
        right:-20px;
        bottom:2%;
    }

    .click-text{
        bottom:3%;
        white-space:nowrap;
        font-size:14px;
    }

    .login-box{
        padding:30px 22px 32px;
    }
}

</style>
</head>

<body>

<div class="background-light"></div>

<!-- ==================================
     หน้า 1
================================== -->

<section id="welcomePage" class="page active">

    <div class="header">
        <h1>น้องชบาแก้ว – ยินดีต้อนรับ</h1>
        <p>Nong Chaba Kaew – Welcome</p>
    </div>

    <div
        class="cpu"
        id="fanButton"
        title="คลิกเพื่อเข้าสู่ระบบ"
    >

        <div class="fan-frame">

            <div class="screw"></div>
            <div class="screw"></div>
            <div class="screw"></div>
            <div class="screw"></div>

        </div>

        <div class="light-ring"></div>

        <div class="blades">

            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>

        </div>

        <!-- ปุ่มกลางพัดลม -->
        <div class="fan-center">

            <div class="login-main">
                LOGIN
            </div>

            <div class="login-sub">
                เข้าสู่ระบบ
            </div>

        </div>

    </div>

    <div class="robot">

        <div class="antenna"></div>

        <div class="robot-head">

            <div class="robot-face">

                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="mouth"></div>

            </div>

        </div>

        <div class="robot-body">

            <div class="robot-screen"></div>

        </div>

        <div class="arm left">
            <div class="hand"></div>
        </div>

        <div class="arm right">
            <div class="hand"></div>
        </div>

    </div>

    <div class="click-text">
        กดปุ่มกลางพัดลมเพื่อเข้าสู่ระบบ
    </div>

</section>


<!-- ==================================
     หน้า 2 LOGIN
================================== -->

<section id="loginPage" class="page hidden">

    <div class="login-box">

        <div class="login-title">

            ยินดีต้อรับ

            <span>
                กรุณากรอกข้อมูลเพื่อเข้าสู่ระบบ
            </span>

        </div>


        <!-- Username -->

        <div class="input-group">

            <div class="input-icon">
                👤
            </div>

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="username"
            >

        </div>


        <!-- Password -->

        <div class="input-group">

            <div class="input-icon">
                🔑
            </div>

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >

        </div>


        <!-- ข้อความแจ้งเตือน -->

        <div
            id="errorMessage"
            class="error"
        ></div>


        <!-- ปุ่ม Login
             จะปรากฏเมื่อกรอกครบ -->
             
        <button
            id="loginButton"
            class="login-button hidden-button"
        >
            LOGIN
        </button>

    </div>


    <!-- พัดลมด้านหลัง -->

    <div
        class="cpu"
        style="
            position:absolute;
            width:min(58vw,620px);
            height:min(58vw,620px);
            opacity:.18;
            filter:blur(1px);
            z-index:1;
        "
    >

        <div class="light-ring"></div>

        <div class="blades">

            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>
            <div class="blade"></div>

        </div>

    </div>

    <!-- หุ่นยนต์หน้าที่ 2 -->

    <div
        class="robot"
        style="
            left:6%;
            right:auto;
            bottom:7%;
            transform:scale(.9);
        "
    >

        <div class="antenna"></div>

        <div class="robot-head">

            <div class="robot-face">

                <div class="eye left"></div>
                <div class="eye right"></div>

                <div class="mouth"></div>

            </div>

        </div>

        <div class="robot-body">

            <div class="robot-screen"></div>

        </div>

        <div class="arm left">
            <div class="hand"></div>
        </div>

        <div class="arm right">
            <div class="hand"></div>
        </div>

    </div>

</section>


<script>

/* ==================================================
   ตั้งค่าระบบตรงนี้
================================================== */

// Username ที่ถูกต้อง
const CORRECT_USERNAME = "kay";

// Password ที่ถูกต้อง
const CORRECT_PASSWORD = "27012008";

// เว็บไซต์ที่จะเปิดหลัง Login สำเร็จ
const TARGET_WEBSITE = "https://disornlaliw61-create.github.io/menu/";


/* ==================================================
   เรียก Element
================================================== */

const welcomePage =
    document.getElementById("welcomePage");

const loginPage =
    document.getElementById("loginPage");

const fanButton =
    document.getElementById("fanButton");

const username =
    document.getElementById("username");

const password =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const errorMessage =
    document.getElementById("errorMessage");


/* ==================================================
   คลิกตรงกลางพัดลม
   ไปหน้าที่ 2
================================================== */

fanButton.addEventListener("click", function(){

    welcomePage.classList.remove("active");
    welcomePage.classList.add("hidden");

    loginPage.classList.remove("hidden");
    loginPage.classList.add("active");

    setTimeout(function(){

        username.focus();

    },700);

});


/* ==================================================
   ตรวจว่ากรอก Username + Password ครบหรือยัง
================================================== */

function checkInput(){

    const user =
        username.value.trim();

    const pass =
        password.value.trim();

    if(user !== "" && pass !== ""){

        loginButton.classList.remove(
            "hidden-button"
        );

    }else{

        loginButton.classList.add(
            "hidden-button"
        );

    }

    errorMessage.textContent = "";

}


/* ตรวจทุกครั้งที่พิมพ์ */

username.addEventListener(
    "input",
    checkInput
);

password.addEventListener(
    "input",
    checkInput
);


/* ==================================================
   ระบบ Login
================================================== */

function doLogin(){

    const user =
        username.value.trim();

    const pass =
        password.value.trim();


    /* ยังไม่ได้กรอก */

    if(user === "" || pass === ""){

        errorMessage.textContent =
            "กรุณากรอก Username และ Password";

        return;

    }


    /* ตรวจ Username + Password */

    if(
        user === CORRECT_USERNAME &&
        pass === CORRECT_PASSWORD
    ){

        errorMessage.style.color =
            "#55ffb0";

        errorMessage.textContent =
            "เข้าสู่ระบบสำเร็จ กำลังเข้าสู่เว็บไซต์...";


        /* ปิดปุ่มชั่วคราว */

        loginButton.disabled = true;

        loginButton.textContent =
            "กำลังเข้าสู่ระบบ...";


        /*
         * รอเล็กน้อยเพื่อให้เห็นข้อความ
         * แล้วเปลี่ยนเว็บไซต์
         */

        setTimeout(function(){

            window.location.href =
                TARGET_WEBSITE;

        },1000);


    }else{

        /* Login ไม่ถูกต้อง */

        errorMessage.style.color =
            "#ff6b6b";

        errorMessage.textContent =
            "Username หรือ Password ไม่ถูกต้อง";

        password.value = "";

        loginButton.classList.add(
            "hidden-button"
        );

        password.focus();

    }

}


/* ==================================================
   คลิกปุ่ม LOGIN
================================================== */

loginButton.addEventListener(
    "click",
    doLogin
);


/* ==================================================
   กด ENTER บน Keyboard
================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            /*
             * ถ้ากำลังอยู่หน้าล็อกอิน
             */

            if(
                loginPage.classList.contains("active")
            ){

                doLogin();

            }

        }

    }
);

</script>
