<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Tech Login</title>
    <!-- Font Awesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ฝ่าย CSS ทำงานร่วมกับ HTML โดยตรง -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #0b0f19;
        }

        /* พื้นหลังเทคโนโลยีแบบ Futuristic */
        .tech-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #2b4c7e 0%, #0a1128 100%);
            z-index: -1;
        }

        .tech-bg::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .container {
            position: relative;
            width: 900px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-step {
            position: absolute;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .card-step.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.9);
        }

        .card-step.active {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        /* --- หน้า 1: ลูกฟันเฟืองตรงกลาง --- */
        .hexagon-wrapper {
            cursor: pointer;
        }

        .hexagon {
            width: 260px;
            height: 290px;
            background: #c2c9d6;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 8px solid #000;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }

        .gear-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gear-icon {
            font-size: 170px;
            color: #1a1a1a;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gear-text {
            position: absolute;
            font-weight: bold;
            font-size: 24px;
            color: #1a1a1a;
            background: #c2c9d6;
            padding: 10px 15px;
            border-radius: 50%;
            pointer-events: none;
        }

        /* เอฟเฟกต์หมุนซ้าย - ขวา */
        .rotate-right {
            transform: rotate(180deg);
        }

        .rotate-left {
            transform: rotate(-180deg);
        }

        /* --- หน้า 2: ฟอร์มล็อกอิน --- */
        .login-panel {
            width: 850px;
            height: 480px;
            display: flex;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .form-side {
            flex: 1.2;
            background: #446bf2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .welcome-header {
            background: #ffffff;
            color: #000;
            font-size: 28px;
            font-weight: bold;
            padding: 12px 60px;
            border-radius: 40px;
            margin-bottom: 25px;
        }

        #login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .input-group {
            width: 90%;
        }

        .input-group input {
            width: 100%;
            padding: 16px 25px;
            border-radius: 30px;
            border: 2px solid transparent;
            background: #cdd9ff;
            font-size: 18px;
            color: #333;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .input-group input::placeholder {
            color: #555;
        }

        /* กล่องข้อความแจ้งเตือนรหัสผิด */
        .error-message {
            color: #ff3333;
            background: rgba(255, 255, 255, 0.9);
            padding: 6px 15px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
            display: none; /* ซ่อนไว้ก่อน */
        }

        .btn-login {
            margin-top: 10px;
            padding: 12px 45px;
            border-radius: 25px;
            border: none;
            background: #00d4ff;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #ffffff;
            box-shadow: 0 0 15px #00d4ff;
        }

        .graphic-side {
            flex: 0.8;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top-right-radius: 60px;
        }

        .avatar-circle {
            width: 220px;
            height: 220px;
            background: #eef2f7;
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .laptop-icon {
            font-size: 100px;
            color: #1d3557;
        }

        .lock-icon {
            position: absolute;
            right: 35px;
            bottom: 50px;
            font-size: 40px;
            color: #f4a261;
        }
    </style>
</head>
<body>

    <div class="tech-bg"></div>

    <div class="container">
        <!-- หน้าที่ 1: หน้าลูกฟันเฟือง -->
        <div id="step-1" class="card-step active">
            <div class="hexagon-wrapper" id="gear-btn">
                <div class="hexagon">
                    <div class="gear-container">
                        <i class="fa-solid fa-gear gear-icon"></i>
                        <span class="gear-text">LOGIN</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- หน้าที่ 2: ฟอร์มล็อกอิน -->
        <div id="step-2" class="card-step hidden">
            <div class="login-panel">
                <div class="form-side">
                    <div class="welcome-header">ยินดีต้อนรับ</div>
                    <form id="login-form" onsubmit="handleLogin(event)">
                        <div class="input-group">
                            <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน" required>
                        </div>
                        <div class="input-group">
                            <input type="password" id="password" placeholder="รหัสผ่าน" required>
                        </div>
                        <!-- แสดงข้อความเมื่อรหัสผ่านผิด -->
                        <div id="error-msg" class="error-message">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!</div>

                        <!-- รองรับทั้งการคลิกปุ่ม และกด Enter บนคีย์บอร์ด -->
                        <button type="submit" class="btn-login">เข้าสู่ระบบ</button>
                    </form>
                </div>
                <div class="graphic-side">
                    <div class="avatar-circle">
                        <i class="fa-solid fa-laptop-code laptop-icon"></i>
                        <i class="fa-solid fa-lock lock-icon"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- เรียกใช้ JavaScript จากไฟล์ script.js แยกต่างหาก -->
    <script src="script.js"></script>
</body>
</html>
